name: One-time M2 QA Fixture Migration

on:
  push:
    branches:
      - m2-composition-aware-visual-qa
    paths:
      - .github/workflows/m2-migrate-qa-fixtures.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: m2-composition-aware-visual-qa
          fetch-depth: 0
      - name: Add new QA score dimensions to legacy fixtures
        run: |
          python - <<'PY'
          from pathlib import Path
          paths = [
              Path('tests/productionOrchestrator.test.ts'),
              Path('tests/structuredImageBriefWiring.test.ts'),
          ]
          for path in paths:
              text = path.read_text()
              old = '      realism: decision === "PASS" ? 90 : 70,\n      composition: decision === "PASS" ? 92 : 60,'
              if old in text:
                  text = text.replace(
                      old,
                      '      realism: decision === "PASS" ? 90 : 70,\n      foodTexture: decision === "PASS" ? 88 : 68,\n      composition: decision === "PASS" ? 92 : 60,\n      copyZoneSuitability: decision === "PASS" ? 90 : 62,',
                  )
              old2 = '      realism: 80,\n      composition: 60,'
              if old2 in text:
                  text = text.replace(
                      old2,
                      '      realism: 80,\n      foodTexture: 78,\n      composition: 60,\n      copyZoneSuitability: 58,',
                  )
              path.write_text(text)
          PY
      - name: Commit fixture migration
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/productionOrchestrator.test.ts tests/structuredImageBriefWiring.test.ts
          git commit -m "Migrate visual QA test fixtures to eight scores"
          git push origin HEAD:m2-composition-aware-visual-qa
