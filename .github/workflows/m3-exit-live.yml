name: M3 Exit Live Calibration
# round 2 after generic concept governance and structured-brief fallback fixes

on:
  push:
    branches:
      - m3-exit-calibration
    paths:
      - .github/workflows/m3-exit-live.yml

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      M3_CALIBRATION_ALLOW_SYNTHETIC: "true"
      ALLOW_PAID_MEDIA: "true"

    steps:
      - name: Checkout calibration branch
        uses: actions/checkout@v6
        with:
          ref: m3-exit-calibration

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify live prerequisites
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY is not available to this workflow."
            exit 1
          fi
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "Chrome/Chromium was not found on the runner."
            exit 1
          fi
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          echo "Live Gemini calibration prerequisites are available."

      - name: Run four-case M3 exit calibration
        id: calibration
        shell: bash
        run: |
          set +e
          npm run calibration:m3-exit
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload M3 calibration bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-exit-calibration
          path: output/m3-exit-calibration
          if-no-files-found: warn

      - name: Enforce calibration result
        if: always()
        run: |
          code="${{ steps.calibration.outputs.exit_code }}"
          if [ -z "$code" ]; then
            echo "Calibration did not produce an exit code."
            exit 1
          fi
          exit "$code"
