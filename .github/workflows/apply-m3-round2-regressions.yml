name: Apply M3 Round2 Regressions

on:
  push:
    branches:
      - m3-exit-calibration
    paths:
      - .github/workflows/apply-m3-round2-regressions.yml

permissions:
  contents: write

jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout calibration branch
        uses: actions/checkout@v6
        with:
          ref: m3-exit-calibration
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply diagnosed Round2 fixes
        run: |
          python3 scripts/_temp_patch_m3_round2.py
          python3 scripts/_temp_patch_m3_round2_fixtures.py
          python3 scripts/_temp_patch_m3_round2_legacy_assertion.py

      - name: Full repository gate
        run: npm run check

      - name: Commit validated permanent changes
        run: |
          rm scripts/_temp_patch_m3_round2.py
          rm scripts/_temp_patch_m3_round2_fixtures.py
          rm scripts/_temp_patch_m3_round2_legacy_assertion.py
          rm .github/workflows/apply-m3-round2-regressions.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix M3 exit Round2 regressions"
          git push origin HEAD:m3-exit-calibration
