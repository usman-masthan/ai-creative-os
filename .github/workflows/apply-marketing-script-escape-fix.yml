name: Apply Marketing Manager script escape fix

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/apply-marketing-script-escape-fix.py'
      - '.github/workflows/apply-marketing-script-escape-fix.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: fix-marketing-manager-script-escaping
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Apply browser-script escape fix
        run: python3 scripts/apply-marketing-script-escape-fix.py
      - name: Install dependencies
        run: npm ci
      - name: Full repository gate
        run: npm run check
      - name: Commit validated permanent changes
        run: |
          rm scripts/apply-marketing-script-escape-fix.py
          rm .github/workflows/apply-marketing-script-escape-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Marketing Manager browser script escaping'
          git push origin HEAD:fix-marketing-manager-script-escaping
