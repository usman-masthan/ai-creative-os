name: Apply M2 food truth guard v2

on:
  push:
    branches:
      - m2-exit-food-truth-guard
    paths:
      - .github/workflows/apply-m2-food-truth-guard-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m2-exit-food-truth-guard
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply serving and preparation truth guard
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/visualQa/types.ts')
          t = p.read_text()
          old = '  verifiedVisibleIngredients?: string[];\n  mustInclude?: string[];\n'
          assert old in t
          p.write_text(t.replace(old, '  verifiedVisibleIngredients?: string[];\n  verifiedCookingMethods?: string[];\n  foodTemplateId?: string;\n  mustInclude?: string[];\n', 1))

          p = Path('src/commands/producePlannedCampaign.ts')
          t = p.read_text()
          pattern = r'function buildVisualQaRequest\(input: \{.*?\n\}\n\nasync function persistOrchestration'
          match = re.search(pattern, t, flags=re.S)
          assert match, 'buildVisualQaRequest block not found'
          replacement = '''function buildVisualQaRequest(input: {\n  context: PlannedVisualQaContext;\n  entry: MarketingCalendarEntry;\n  layout: AtthasLayoutDefinition;\n  bytes: Buffer;\n  mimeType: string;\n  structuredBrief?: StructuredImageBrief;\n  foodComposition?: DeterministicFoodComposition;\n}): VisualQaRequest {\n  const compositionRequirements = [\n    ...input.layout.imageCompositionRequirements,\n    ...(input.context.compositionRequirements ?? []),\n  ];\n  const compositionExpectation = compositionExpectationFromBrief(input.structuredBrief);\n  const foodTruthMustInclude =\n    input.foodComposition?.templateId === "WRAP_ROLL"\n      ? ["one coherent wrap-style food subject; do not convert verified ingredients into separately served side dishes"]\n      : [];\n  const foodTruthMustNotInclude = [\n    ...(input.foodComposition?.templateId === "WRAP_ROLL"\n      ? [\n          "separate side salad, separate sauce or dip ramekin, extra side dish, or duplicate serving component outside the wrap unless explicitly verified",\n        ]\n      : []),\n    ...((input.foodComposition?.confirmedCookingMethods.length ?? 0) === 0 && input.foodComposition\n      ? [\n          "visible preparation cues that imply an unverified cooking method, including grill marks, griddle marks, toast marks, sear marks or deliberate charring beyond neutral browning",\n        ]\n      : []),\n  ];\n\n  return {\n    ...input.context,\n    brandId: input.entry.brandId,\n    ...(input.entry.branchScope !== "BRAND_WIDE"\n      ? { branchId: input.entry.branchScope }\n      : {}),\n    imageBase64: input.bytes.toString("base64"),\n    mimeType: input.mimeType,\n    mustInclude: [...new Set([...(input.context.mustInclude ?? []), ...foodTruthMustInclude])],\n    mustNotInclude: [...new Set([...(input.context.mustNotInclude ?? []), ...foodTruthMustNotInclude])],\n    compositionRequirements: [...new Set(compositionRequirements)],\n    ...(input.foodComposition\n      ? {\n          foodTemplateId: input.foodComposition.templateId,\n          verifiedCookingMethods: [...input.foodComposition.confirmedCookingMethods],\n        }\n      : {}),\n    ...(compositionExpectation ? { compositionExpectation } : {}),\n  };\n}\n\nasync function persistOrchestration'''
          t = t[:match.start()] + replacement + t[match.end():]
          call_anchor = '''        ...(current.summary.structuredBrief\n          ? { structuredBrief: current.summary.structuredBrief }\n          : {}),\n'''
          assert call_anchor in t
          t = t.replace(call_anchor, call_anchor + '''        ...(current.summary.foodComposition\n          ? { foodComposition: current.summary.foodComposition }\n          : {}),\n''', 1)
          p.write_text(t)

          p = Path('src/visualQa/gemini.ts')
          t = p.read_text()
          old = '  const verifiedIngredients = request.verifiedVisibleIngredients ?? [];\n  const mustInclude = request.mustInclude ?? [];\n'
          assert old in t
          t = t.replace(old, '  const verifiedIngredients = request.verifiedVisibleIngredients ?? [];\n  const verifiedCookingMethods = request.verifiedCookingMethods ?? [];\n  const mustInclude = request.mustInclude ?? [];\n', 1)
          old = '    `Verified visible ingredients: ${verifiedIngredients.length ? verifiedIngredients.join(", ") : "NONE PROVIDED"}`,\n    `Must include: ${mustInclude.length ? mustInclude.join(", ") : "NONE"}`,\n'
          assert old in t
          t = t.replace(old, '    `Verified visible ingredients: ${verifiedIngredients.length ? verifiedIngredients.join(", ") : "NONE PROVIDED"}`,\n    `Verified cooking methods: ${verifiedCookingMethods.length ? verifiedCookingMethods.join(", ") : "NONE PROVIDED"}`,\n    `Deterministic food template: ${request.foodTemplateId ?? "UNSPECIFIED"}`,\n    `Must include: ${mustInclude.length ? mustInclude.join(", ") : "NONE"}`,\n', 1)
          anchor = '    "Reject or escalate if the image contains unverified visible ingredients, wrong product form, accidental text/logo, malformed food, impossible geometry, misleading portion perspective, missing requested copy-safe space, unsafe crop, or brand-incompatible styling.",\n'
          assert anchor in t
          t = t.replace(anchor, anchor + '''    "Serving configuration is part of product truth. A verified ingredient shown as a separate side dish, side salad, dipping bowl or ramekin is still an unverified serving element unless the supplied must-include contract explicitly authorizes that separate serving.",\n    "When the deterministic food template is WRAP_ROLL, inspect the full frame for side bowls, ramekins, salads, fries, garnish dishes or duplicated serving components outside the wrap. If any are visible without explicit authorization, list them in unexpectedVisibleElements and productTruth cannot be PASS.",\n    "Cooking-method cues are also product truth. When verified cooking methods are NONE PROVIDED, visible grill marks, griddle marks, toast marks, sear marks or deliberate charring that communicate a preparation method must be a productTruth CONCERN/FAIL and must not PASS merely because the underlying ingredient is verified.",\n''', 1)
          guard_anchor = '''  if (request.visualClass === "GENERIC_CONCEPT_VISUAL" && decision === "PASS") {\n    decision = "HUMAN_REVIEW";\n    issues.push("Generic concept imagery cannot pass as verified product advertising.");\n  }\n\n'''
          assert guard_anchor in t
          t = t.replace(guard_anchor, guard_anchor + '''  const evidenceText = [\n    ...result.issues,\n    ...result.notes,\n    ...result.unexpectedVisibleElements,\n    ...Object.values(result.scoreEvidence ?? {}).flatMap((item) => item.observations),\n  ]\n    .join(" ")\n    .toLowerCase();\n\n  if (\n    request.foodTemplateId === "WRAP_ROLL" &&\n    /\\b(side salad|salad bowl|side dish|side bowl|dipping sauce|dip bowl|sauce ramekin|ramekin)\\b/.test(evidenceText)\n  ) {\n    decision = "REGENERATE";\n    issues.push("Separate serving elements are outside the verified WRAP_ROLL presentation contract.");\n  }\n\n  if (\n    (request.verifiedCookingMethods?.length ?? 0) === 0 &&\n    /\\b(grill marks?|griddle marks?|toast marks?|sear marks?|char marks?)\\b/.test(evidenceText)\n  ) {\n    decision = "REGENERATE";\n    issues.push("Visible preparation cues imply a cooking method that was not separately verified.");\n  }\n\n''', 1)
          p.write_text(t)

          p = Path('scripts/m2-exit-qa-recheck.ts')
          t = p.read_text()
          old = '  imageAttempts: Array<{ attempt: number; model: string; rawImagePath: string; structuredBrief: StructuredImageBrief | null }>;\n};\n'
          assert old in t
          t = t.replace(old, '  imageAttempts: Array<{ attempt: number; model: string; rawImagePath: string; structuredBrief: StructuredImageBrief | null; foodComposition?: { templateId: string; confirmedCookingMethods: string[] } }>;\n};\n', 1)
          old = '    verifiedVisibleIngredients: [...report.product.ingredients],\n    mustInclude: ["one coherent wrap-style food hero"],\n'
          assert old in t
          t = t.replace(old, '    verifiedVisibleIngredients: [...report.product.ingredients],\n    ...(attempt.foodComposition ? { foodTemplateId: attempt.foodComposition.templateId, verifiedCookingMethods: [...attempt.foodComposition.confirmedCookingMethods] } : {}),\n    mustInclude: ["one coherent wrap-style food hero; do not convert verified ingredients into separately served side dishes"],\n', 1)
          old = '      "decorative graphic strips"\n    ],\n'
          assert old in t
          t = t.replace(old, '      "decorative graphic strips",\n      "separate side salad, separate sauce or dip ramekin, extra side dish, or duplicate serving component outside the wrap",\n      "visible grill marks, griddle marks, toast marks, sear marks or deliberate charring that imply an unverified cooking method"\n    ],\n', 1)
          p.write_text(t)

          p = Path('tests/geminiVisualQa.test.ts')
          t = p.read_text()
          if 'WRAP_ROLL rejects separate serving elements' not in t:
              t += r'''\n\ntest("WRAP_ROLL rejects separate serving elements even when ingredients themselves are verified", async () => {\n  const response = visualQaResponse("PASS");\n  const payload = (await response.json()) as { candidates: Array<{ content: { parts: Array<{ text: string }> } }> };\n  const part = payload.candidates[0]!.content.parts[0]!;\n  const review = JSON.parse(part.text) as Record<string, any>;\n  review.scores = { productTruth: 95, brandFit: 80, realism: 90, foodTexture: 90, composition: 88, copyZoneSuitability: 80, governance: 95, rights: 100 };\n  review.scoreEvidence.productTruth = { status: "PASS", observations: ["Verified ingredients accurately depicted in wrap format, with a separate side salad and sauce ramekin."] };\n  review.unexpectedVisibleElements = [];\n  part.text = JSON.stringify(review);\n  const provider = new GeminiVisualQaProvider({ apiKey: "gemini-test-key", fetchImpl: async () => new Response(JSON.stringify(payload), { status: 200, headers: { "Content-Type": "application/json" } }) });\n  const result = await provider.review({ imageBase64: "ZmFrZQ==", mimeType: "image/jpeg", brandId: "ATTHAS_RESTAURANT", productId: "CALIBRATION_CHICKEN_TIKKA_WRAP", productName: "Chicken Tikka Wrap", visualClass: "CONSTRAINED_PRODUCT_GENERATION", rightsStatus: "cleared", verifiedVisibleIngredients: ["chicken tikka", "tortilla", "sauce", "lettuce", "onion", "tomato", "coriander"], verifiedCookingMethods: [], foodTemplateId: "WRAP_ROLL" });\n  assert.equal(result.decision, "REGENERATE");\n  assert.ok(result.issues.some((issue) => issue.includes("WRAP_ROLL presentation contract")));\n});\n\ntest("unverified grill-mark evidence cannot PASS when no cooking method is verified", async () => {\n  const response = visualQaResponse("PASS");\n  const payload = (await response.json()) as { candidates: Array<{ content: { parts: Array<{ text: string }> } }> };\n  const part = payload.candidates[0]!.content.parts[0]!;\n  const review = JSON.parse(part.text) as Record<string, any>;\n  review.scores = { productTruth: 95, brandFit: 80, realism: 90, foodTexture: 90, composition: 88, copyZoneSuitability: 80, governance: 95, rights: 100 };\n  review.scoreEvidence.foodTexture = { status: "PASS", observations: ["Clear grill marks and fresh vegetable textures."] };\n  part.text = JSON.stringify(review);\n  const provider = new GeminiVisualQaProvider({ apiKey: "gemini-test-key", fetchImpl: async () => new Response(JSON.stringify(payload), { status: 200, headers: { "Content-Type": "application/json" } }) });\n  const result = await provider.review({ imageBase64: "ZmFrZQ==", mimeType: "image/jpeg", brandId: "ATTHAS_RESTAURANT", productId: "CALIBRATION_CHICKEN_TIKKA_WRAP", productName: "Chicken Tikka Wrap", visualClass: "CONSTRAINED_PRODUCT_GENERATION", rightsStatus: "cleared", verifiedVisibleIngredients: ["chicken tikka", "tortilla", "sauce", "lettuce", "onion", "tomato", "coriander"], verifiedCookingMethods: [], foodTemplateId: "WRAP_ROLL" });\n  assert.equal(result.decision, "REGENERATE");\n  assert.ok(result.issues.some((issue) => issue.includes("cooking method that was not separately verified")));\n});\n'''.replace('\\n', '\n')
          p.write_text(t)

          p = Path('docs/M2_EXIT_CALIBRATION.md')
          t = p.read_text()
          if '## 2026-08-28 exit result' not in t:
              t += '''\n\n## 2026-08-28 exit result\n\nThe integrated M2 exit calibration is **closed as PASS for the selected candidate**. The run remained synthetic, non-publishable and performed no truth write-back.\n\n- Selected reference: `draft-attempt-01.jpg` from `gemini-3.1-flash-lite-image`.\n- Corrected evidence-aware Visual QA: PASS with productTruth 90, realism 85, foodTexture 82, composition 83, governance 90 and upper-left copy zone GOOD.\n- Manual visual review: PASS. The selected image had no baked-in graphic elements, no obvious extra ingredient, credible food texture/lighting and the strongest upper-left copy-safe area of the three attempts.\n- Attempt 2 exposed a QA false positive: grill marks plus a separate side salad / sauce ramekin implied unverified preparation and serving configuration. M2 was not closed until a deterministic serving/preparation truth guard and regression tests were added.\n- Attempt 3 was visually strong but had a less reliable upper-left copy zone than attempt 1 in manual review.\n\nThis closes the M2 mini-calibration and authorizes moving to M3 renderer work. The M2.8 Flash Lite / Flash / Pro score thresholds are still explicitly provisional until the separate 20-image calibration set is completed.\n'''
          p.write_text(t)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Validate repository
        run: npm run check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/visualQa/types.ts src/commands/producePlannedCampaign.ts src/visualQa/gemini.ts scripts/m2-exit-qa-recheck.ts tests/geminiVisualQa.test.ts docs/M2_EXIT_CALIBRATION.md
          git commit -m "Guard M2 food preparation and serving truth"
          git push
