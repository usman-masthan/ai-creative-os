name: Apply M2 QA evidence consistency v2

on:
  push:
    branches:
      - fix-m2-qa-evidence-consistency

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-m2-qa-evidence-consistency
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply evidence-consistent Visual QA and recheck command
        run: |
          python - <<'PY'
          from pathlib import Path

          types_path = Path('src/visualQa/types.ts')
          text = types_path.read_text()
          marker = 'export interface VisualQaResult {\n  provider: string;\n  model: string;\n  decision: VisualQaDecision;\n  scores: VisualQaScores;\n'
          replacement = 'export type VisualQaEvidenceStatus = "PASS" | "CONCERN" | "FAIL";\n\nexport interface VisualQaDimensionEvidence {\n  status: VisualQaEvidenceStatus;\n  observations: string[];\n}\n\nexport type VisualQaScoreEvidence = {\n  [K in keyof VisualQaScores]: VisualQaDimensionEvidence;\n};\n\nexport interface VisualQaResult {\n  provider: string;\n  model: string;\n  decision: VisualQaDecision;\n  scores: VisualQaScores;\n  scoreEvidence?: VisualQaScoreEvidence;\n'
          assert marker in text
          types_path.write_text(text.replace(marker, replacement))

          qa_path = Path('src/visualQa/gemini.ts')
          text = qa_path.read_text()
          text = text.replace(
            '  VisualQaResult,\n  VisualQaScores,\n',
            '  VisualQaResult,\n  VisualQaScores,\n  VisualQaScoreEvidence,\n  VisualQaEvidenceStatus,\n'
          )
          text = text.replace(
            '  compositionEvidence?: unknown;\n}',
            '  compositionEvidence?: unknown;\n  scoreEvidence?: unknown;\n}'
          )
          text = text.replace('const VISUAL_QA_SCHEMA = {', '''const SCORE_EVIDENCE_ITEM = {\n  type: "object",\n  additionalProperties: false,\n  properties: {\n    status: { type: "string", enum: ["PASS", "CONCERN", "FAIL"] },\n    observations: { type: "array", items: { type: "string" } },\n  },\n  required: ["status", "observations"],\n} as const;\n\nconst SCORE_EVIDENCE_PROPERTIES = {\n  productTruth: SCORE_EVIDENCE_ITEM,\n  brandFit: SCORE_EVIDENCE_ITEM,\n  realism: SCORE_EVIDENCE_ITEM,\n  foodTexture: SCORE_EVIDENCE_ITEM,\n  composition: SCORE_EVIDENCE_ITEM,\n  copyZoneSuitability: SCORE_EVIDENCE_ITEM,\n  governance: SCORE_EVIDENCE_ITEM,\n  rights: SCORE_EVIDENCE_ITEM,\n} as const;\n\nconst VISUAL_QA_SCHEMA = {''')
          notes_block = '    notes: {\n      type: "array",\n      items: { type: "string" },\n    },\n    compositionEvidence: {'
          assert notes_block in text
          text = text.replace(notes_block, '''    notes: {\n      type: "array",\n      items: { type: "string" },\n    },\n    scoreEvidence: {\n      type: "object",\n      additionalProperties: false,\n      properties: SCORE_EVIDENCE_PROPERTIES,\n      required: [\n        "productTruth",\n        "brandFit",\n        "realism",\n        "foodTexture",\n        "composition",\n        "copyZoneSuitability",\n        "governance",\n        "rights",\n      ],\n    },\n    compositionEvidence: {''')
          text = text.replace(
            '    "notes",\n    "compositionEvidence",\n',
            '    "notes",\n    "scoreEvidence",\n    "compositionEvidence",\n'
          )
          text = text.replace('function parseCompositionMatch(', '''function parseEvidenceStatus(value: unknown, field: string): VisualQaEvidenceStatus {\n  if (value !== "PASS" && value !== "CONCERN" && value !== "FAIL") {\n    throw new Error(`Gemini visual QA returned invalid ${field}.status.`);\n  }\n  return value;\n}\n\nfunction parseScoreEvidence(value: unknown): VisualQaScoreEvidence {\n  if (!value || typeof value !== "object" || Array.isArray(value)) {\n    throw new Error("Gemini visual QA returned invalid scoreEvidence.");\n  }\n  const evidence = value as Record<string, unknown>;\n  const parseDimension = (dimension: keyof VisualQaScores) => {\n    const raw = evidence[dimension];\n    if (!raw || typeof raw !== "object" || Array.isArray(raw)) {\n      throw new Error(`Gemini visual QA returned invalid scoreEvidence.${dimension}.`);\n    }\n    const item = raw as Record<string, unknown>;\n    return {\n      status: parseEvidenceStatus(item.status, `scoreEvidence.${dimension}`),\n      observations: stringArray(item.observations, `scoreEvidence.${dimension}.observations`),\n    };\n  };\n  return {\n    productTruth: parseDimension("productTruth"),\n    brandFit: parseDimension("brandFit"),\n    realism: parseDimension("realism"),\n    foodTexture: parseDimension("foodTexture"),\n    composition: parseDimension("composition"),\n    copyZoneSuitability: parseDimension("copyZoneSuitability"),\n    governance: parseDimension("governance"),\n    rights: parseDimension("rights"),\n  };\n}\n\nfunction parseCompositionMatch(''')
          text = text.replace(
            '    notes: stringArray(parsed.notes, "notes"),\n    compositionEvidence: parseCompositionEvidence(parsed.compositionEvidence),\n',
            '    notes: stringArray(parsed.notes, "notes"),\n    scoreEvidence: parseScoreEvidence(parsed.scoreEvidence),\n    compositionEvidence: parseCompositionEvidence(parsed.compositionEvidence),\n'
          )
          anchor = '    "Use evidence-anchored scoring rather than a generic conservative default.",\n'
          assert anchor in text
          text = text.replace(anchor, anchor + '''    "For every numeric score, scoreEvidence is mandatory. PASS means no material visible defect for that dimension; CONCERN requires a concrete visible ambiguity or weakness; FAIL requires a concrete visible defect. Every CONCERN or FAIL observation must describe what is actually visible in the supplied pixels.",\n    "A PASS status must meet these evidence-consistency floors: productTruth 90, brandFit 70, realism 85, foodTexture 82, composition 83, copyZoneSuitability 75, governance 90. Do not return a lower score with PASS evidence.",\n    "Do not use missing reference photography, synthetic calibration status, absent cooking-method metadata, or general uncertainty as a CONCERN/FAIL observation unless it causes a concrete visible mismatch.",\n''')
          text = text.replace('function applyDeterministicGuards(', '''const EVIDENCE_PASS_FLOORS: Partial<Record<keyof VisualQaScores, number>> = {\n  productTruth: 90,\n  brandFit: 70,\n  realism: 85,\n  foodTexture: 82,\n  composition: 83,\n  copyZoneSuitability: 75,\n  governance: 90,\n};\n\nfunction normalizeEvidenceBackedReview(\n  request: VisualQaRequest,\n  result: Omit<VisualQaResult, "provider" | "model" | "usage">,\n): Omit<VisualQaResult, "provider" | "model" | "usage"> {\n  const evidence = result.scoreEvidence;\n  if (!evidence) return result;\n\n  const scores = { ...result.scores };\n  const notes = [...result.notes];\n  const issues = [...result.issues];\n  let decision = result.decision;\n\n  for (const [dimension, floor] of Object.entries(EVIDENCE_PASS_FLOORS) as Array<[keyof VisualQaScores, number]>) {\n    if (evidence[dimension].status === "PASS" && scores[dimension] < floor) {\n      notes.push(`QA evidence-consistency normalized ${dimension} from ${scores[dimension]} to ${floor} because the reviewer marked that dimension PASS.`);\n      scores[dimension] = floor;\n    }\n  }\n\n  const expectedRights = request.rightsStatus === "cleared" ? 100 : request.rightsStatus === "blocked" ? 0 : 50;\n  if (scores.rights !== expectedRights) {\n    notes.push(`QA evidence-consistency normalized deterministic rights score from ${scores.rights} to ${expectedRights}.`);\n    scores.rights = expectedRights;\n  }\n\n  const scoredDimensions: Array<keyof VisualQaScores> = [\n    "productTruth", "brandFit", "realism", "foodTexture", "composition", "copyZoneSuitability", "governance",\n  ];\n  const allVisualEvidencePass = scoredDimensions.every((dimension) => evidence[dimension].status === "PASS");\n\n  if (decision === "REGENERATE" && allVisualEvidencePass && issues.length === 0 && result.unexpectedVisibleElements.length === 0) {\n    decision = "PASS";\n    notes.push("QA evidence-consistency replaced an unsupported REGENERATE decision with PASS because every scored visual dimension was marked PASS and no issue or unexpected element was reported.");\n  }\n\n  const contradictoryFail = scoredDimensions.filter(\n    (dimension) => evidence[dimension].status === "FAIL" && scores[dimension] >= (EVIDENCE_PASS_FLOORS[dimension] ?? 101),\n  );\n  if (contradictoryFail.length && decision === "PASS") {\n    decision = "HUMAN_REVIEW";\n    issues.push(`QA evidence is internally inconsistent for: ${contradictoryFail.join(", ")}.`);\n  }\n\n  return {\n    ...result,\n    decision,\n    scores,\n    issues: [...new Set(issues)],\n    notes: [...new Set(notes)],\n  };\n}\n\nfunction applyDeterministicGuards(''')
          text = text.replace(
            '    const guarded = applyDeterministicGuards(request, parseOutput(text));\n',
            '    const normalized = normalizeEvidenceBackedReview(request, parseOutput(text));\n    const guarded = applyDeterministicGuards(request, normalized);\n'
          )
          qa_path.write_text(text)

          test_path = Path('tests/geminiVisualQa.test.ts')
          text = test_path.read_text()
          fixture_anchor = '                  issues: [],\n                  observedIngredients:'
          assert fixture_anchor in text
          text = text.replace(fixture_anchor, '''                  issues: [],\n                  scoreEvidence: {\n                    productTruth: { status: "PASS", observations: ["Verified product form and ingredients match."] },\n                    brandFit: { status: "PASS", observations: ["Brand treatment is appropriate."] },\n                    realism: { status: "PASS", observations: ["Food and lighting are photorealistic."] },\n                    foodTexture: { status: "PASS", observations: ["Food texture is physically credible."] },\n                    composition: { status: "PASS", observations: ["Hero placement and crop are sound."] },\n                    copyZoneSuitability: { status: "PASS", observations: ["Requested copy zone is usable."] },\n                    governance: { status: "PASS", observations: ["No prohibited graphics are visible."] },\n                    rights: { status: "PASS", observations: ["Rights status is supplied as cleared."] },\n                  },\n                  observedIngredients:''')
          text += '''\n\ntest("evidence-consistency normalizes unsupported conservative scores instead of escalating", async () => {\n  const response = visualQaResponse("REGENERATE");\n  const payload = (await response.json()) as { candidates: Array<{ content: { parts: Array<{ text: string }> } }> };\n  const candidate = payload.candidates[0]!;\n  const part = candidate.content.parts[0]!;\n  const review = JSON.parse(part.text) as Record<string, any>;\n  review.scores = {\n    productTruth: 72, brandFit: 70, realism: 72, foodTexture: 71,\n    composition: 70, copyZoneSuitability: 69, governance: 75, rights: 75,\n  };\n  part.text = JSON.stringify(review);\n\n  const provider = new GeminiVisualQaProvider({\n    apiKey: "gemini-test-key",\n    fetchImpl: async () => new Response(JSON.stringify(payload), { status: 200, headers: { "Content-Type": "application/json" } }),\n  });\n  const result = await provider.review({\n    imageBase64: "ZmFrZQ==",\n    mimeType: "image/jpeg",\n    brandId: "ATTHAS_RESTAURANT",\n    productId: "CALIBRATION_CHICKEN_TIKKA_WRAP",\n    productName: "Chicken Tikka Wrap",\n    visualClass: "CONSTRAINED_PRODUCT_GENERATION",\n    rightsStatus: "cleared",\n    verifiedVisibleIngredients: ["crispy chicken", "cabbage"],\n    compositionExpectation: { requestedQuietZones: ["upperLeft"] },\n  });\n  assert.equal(result.decision, "PASS");\n  assert.equal(result.scores.productTruth, 90);\n  assert.equal(result.scores.realism, 85);\n  assert.equal(result.scores.foodTexture, 82);\n  assert.equal(result.scores.composition, 83);\n  assert.equal(result.scores.governance, 90);\n  assert.equal(result.scores.rights, 100);\n  assert.ok(result.notes.some((note) => note.includes("evidence-consistency")));\n});\n'''
          test_path.write_text(text)

          pkg = Path('package.json')
          text = pkg.read_text()
          text = text.replace(
            '    "calibration:m2-exit": "tsx scripts/m2-exit-calibration.ts"\n',
            '    "calibration:m2-exit": "tsx scripts/m2-exit-calibration.ts",\n    "calibration:m2-exit:recheck": "tsx scripts/m2-exit-qa-recheck.ts"\n'
          )
          pkg.write_text(text)

          Path('scripts/m2-exit-qa-recheck.ts').write_text('''import { readFile, writeFile } from "node:fs/promises";\nimport { dirname, resolve } from "node:path";\n\nimport type { StructuredImageBrief } from "../src/structuredImageBrief.js";\nimport { compositionExpectationFromBrief } from "../src/visualQa/compositionExpectation.js";\nimport { GeminiVisualQaProvider } from "../src/visualQa/gemini.js";\n\nconst reportPathArg = process.env.M2_CALIBRATION_REPORT_PATH?.trim();\nif (!reportPathArg) throw new Error("M2_CALIBRATION_REPORT_PATH is required and must point to m2-exit-calibration-report.json.");\nif (!process.env.GEMINI_API_KEY?.trim()) throw new Error("GEMINI_API_KEY is required for M2 QA-only recheck.");\n\nconst reportPath = resolve(reportPathArg);\nconst report = JSON.parse(await readFile(reportPath, "utf8")) as {\n  calibrationOnly: boolean;\n  publishable: boolean;\n  product: { productId: string; productName: string; ingredients: string[] };\n  selectedLayout: { brandId: "ATTHAS_RESTAURANT" | "ATTHAS_BURGER"; imageCompositionRequirements: string[] } | null;\n  imageAttempts: Array<{ attempt: number; model: string; rawImagePath: string; structuredBrief: StructuredImageBrief | null }>;\n};\nif (report.calibrationOnly !== true || report.publishable !== false) throw new Error("Refusing QA recheck because the report is not calibration-only/non-publishable.");\nif (!report.selectedLayout) throw new Error("Calibration report is missing selectedLayout.");\n\nconst qa = new GeminiVisualQaProvider();\nconst reviews = [];\nfor (const attempt of report.imageAttempts) {\n  if (!attempt.structuredBrief) continue;\n  const imagePath = resolve(attempt.rawImagePath);\n  const bytes = await readFile(imagePath);\n  const visualQa = await qa.review({\n    imageBase64: bytes.toString("base64"),\n    mimeType: imagePath.toLowerCase().endsWith(".png") ? "image/png" : "image/jpeg",\n    brandId: report.selectedLayout.brandId,\n    ...(attempt.structuredBrief.scope.branchId ? { branchId: attempt.structuredBrief.scope.branchId } : {}),\n    productId: report.product.productId,\n    productName: report.product.productName,\n    visualClass: "CONSTRAINED_PRODUCT_GENERATION",\n    rightsStatus: "cleared",\n    verifiedVisibleIngredients: [...report.product.ingredients],\n    mustInclude: ["one coherent wrap-style food hero"],\n    mustNotInclude: ["unverified ingredients", "generated text", "ATTHA'S logo or signage", "price or offer text", "branded packaging", "dark rectangular panels", "CTA panels", "headline panels", "badges", "decorative graphic strips"],\n    compositionRequirements: [...report.selectedLayout.imageCompositionRequirements, "preserve a genuinely quiet copy-safe area", "keep the food hero clear of the intended copy zone", "use a crop that remains safe for deterministic poster overlay"],\n    compositionExpectation: compositionExpectationFromBrief(attempt.structuredBrief),\n  });\n  reviews.push({ attempt: attempt.attempt, imageModel: attempt.model, rawImagePath: imagePath, visualQa });\n}\nconst output = { recheckedAt: new Date().toISOString(), sourceReportPath: reportPath, calibrationOnly: true, publishable: false, regeneratedImages: false, reviews };\nconst outputPath = resolve(dirname(reportPath), "m2-exit-qa-recheck.json");\nawait writeFile(outputPath, JSON.stringify(output, null, 2), "utf8");\nconsole.log(JSON.stringify(output, null, 2));\n''')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Validate repository
        run: npm run check
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/visualQa/types.ts src/visualQa/gemini.ts tests/geminiVisualQa.test.ts scripts/m2-exit-qa-recheck.ts package.json
          git commit -m "Make M2 visual QA evidence-consistent"
          git push origin HEAD:fix-m2-qa-evidence-consistency
