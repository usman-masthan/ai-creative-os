name: Apply M2 QA evidence consistency v3

on:
  push:
    branches:
      - fix-m2-qa-evidence-consistency

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-m2-qa-evidence-consistency
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply or validate evidence-consistency patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          types_path = Path('src/visualQa/types.ts')
          if 'scoreEvidence?: VisualQaScoreEvidence;' not in types_path.read_text():
              workflow = Path('.github/workflows/apply-m2-qa-evidence-consistency-v2.yml').read_text()
              start = workflow.index('          from pathlib import Path\n')
              end = workflow.index('\n          PY', start)
              script = textwrap.dedent(workflow[start:end])
              exec(compile(script, '<embedded-v2-patch>', 'exec'), {})

          qa_path = Path('src/visualQa/gemini.ts')
          text = qa_path.read_text()
          text = text.replace(
              '    scoreEvidence: parseScoreEvidence(parsed.scoreEvidence),\n',
              '    ...(parsed.scoreEvidence !== undefined\n      ? { scoreEvidence: parseScoreEvidence(parsed.scoreEvidence) }\n      : {}),\n',
          )
          qa_path.write_text(text)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Validate repository
        run: npm run check
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/visualQa/types.ts src/visualQa/gemini.ts tests/geminiVisualQa.test.ts scripts/m2-exit-qa-recheck.ts package.json
          git commit -m "Make M2 visual QA evidence-consistent"
          git push origin HEAD:fix-m2-qa-evidence-consistency
