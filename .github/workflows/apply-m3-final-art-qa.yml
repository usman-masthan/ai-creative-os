name: Apply M3 final-art QA
on:
  push:
    branches: [m3-final-art-qa]
    paths: [.github/workflows/apply-m3-final-art-qa.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m3-final-art-qa
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python .github/scripts/apply-m3-final-art-qa.py
      - run: npm ci
      - run: npm run check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/commands/producePlannedCampaign.ts
          git commit -m "Require M3 final-art QA in final planned production"
          git push origin HEAD:m3-final-art-qa
