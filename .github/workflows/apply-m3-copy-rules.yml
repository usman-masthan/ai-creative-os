name: Apply M3 copy rules
on:
  push:
    branches: [m3-campaign-copy-rules]
    paths: [.github/workflows/apply-m3-copy-rules.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m3-campaign-copy-rules
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python .github/scripts/apply-m3-copy-rules.py
      - run: npm ci
      - run: npm run check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/commands/generateCampaign.ts src/commands/producePlannedCampaign.ts src/creativeDirectorPrompt.ts src/creativeDirectorTypes.ts src/commands/directCampaign.ts tests/creativeDirector.test.ts
          git commit -m "Wire M3 copy policies into finalization"
          git push origin HEAD:m3-campaign-copy-rules
