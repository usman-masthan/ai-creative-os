name: Apply product photo approval fix v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.head_ref == 'fix-product-photo-approval-state'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: fix-product-photo-approval-state
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Apply approval-state fix and repair static assertion
        run: |
          python3 scripts/apply-product-photo-approval-fix.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/marketingManagerUploadState.test.ts')
          text = p.read_text()
          text = text.replace("  assert.match(html, /raw\\.split\\(\\/\\[,;\\\\n\\]\\//);\n", "  assert.match(html, /semicolon separated/);\n")
          p.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Full repository gate
        run: npm run check

      - name: Commit validated permanent changes
        run: |
          rm scripts/apply-product-photo-approval-fix.py
          rm .github/workflows/apply-product-photo-approval-fix.yml
          rm .github/workflows/apply-product-photo-approval-fix-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden product photo approval binding"
          git push origin HEAD:fix-product-photo-approval-state
