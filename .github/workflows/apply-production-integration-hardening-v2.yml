name: Apply production integration hardening v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.head_ref == 'production-integration-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: production-integration-hardening
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Fix patch helper and apply hardening
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-production-integration-hardening.py')
          s = p.read_text()
          old = 'out, count = re.subn(pattern, repl, text, count=1, flags=re.S)'
          new = 'out, count = re.subn(pattern, lambda _match: repl, text, count=1, flags=re.S)'
          if old not in s:
              raise SystemExit('patch helper target not found')
          p.write_text(s.replace(old, new, 1))
          PY
          python3 scripts/apply-production-integration-hardening.py

      - name: Install dependencies
        run: npm ci

      - name: Full repository gate
        run: npm run check

      - name: Commit validated permanent changes
        run: |
          rm scripts/apply-production-integration-hardening.py
          rm .github/workflows/apply-production-integration-hardening.yml
          rm .github/workflows/apply-production-integration-hardening-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden Marketing Manager production integration"
          git push origin HEAD:production-integration-hardening
