name: One-time M2 Escalation Test Wiring Fixed

on:
  push:
    branches:
      - m2-qa-driven-image-escalation
    paths:
      - .github/workflows/m2-add-escalation-tests-fixed.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: m2-qa-driven-image-escalation
          fetch-depth: 0

      - name: Append end-to-end escalation tests
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          path = Path('tests/productionOrchestrator.test.ts')
          text = path.read_text()
          marker = 'tiered QA escalation uses Flash Lite then Flash then Pro'
          if marker in text:
              print('Escalation tests already present.')
              raise SystemExit(0)
          payload = ''
          path.write_text(text + base64.b64decode(payload).decode())
          PY

      - name: Commit tests
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/productionOrchestrator.test.ts
          git commit -m "Test tiered image escalation end to end"
          git push origin HEAD:m2-qa-driven-image-escalation
