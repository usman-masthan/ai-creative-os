name: M3 Exit Branch Check

on:
  push:
    branches:
      - m3-exit-calibration
    paths:
      - .github/workflows/m3-exit-branch-check.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: m3-exit-calibration
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and test
        run: npm run check
