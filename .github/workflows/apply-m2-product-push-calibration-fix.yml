name: Apply M2 product-push calibration fix

on:
  push:
    branches:
      - fix-m2-product-push-calibration

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-m2-product-push-calibration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply deterministic product-push routing and QA rubric
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/layouts/atthas.ts')
          text = p.read_text()
          text = text.replace(
              'import type {\n  CampaignCreativeOutput,\n  CampaignProductionFormat,\n} from "../creativeTypes.js";\n',
              'import type {\n  CampaignCreativeOutput,\n  CampaignProductionFormat,\n} from "../creativeTypes.js";\nimport type { MarketingCampaignType } from "../marketingPlannerTypes.js";\n'
          )
          text = text.replace(
              '  format: CampaignProductionFormat;\n  preferredLayoutId?: AtthasLayoutId;\n',
              '  format: CampaignProductionFormat;\n  campaignType?: MarketingCampaignType;\n  preferredLayoutId?: AtthasLayoutId;\n'
          )
          text = text.replace(
              '  if (multiDishLanguage) return getLayout("ATTHAS_RESTAURANT_MULTI_DISH_V1");\n  if (role === "brand-building") return getLayout("ATTHAS_RESTAURANT_EDITORIAL_V1");\n',
              '  if (multiDishLanguage) return getLayout("ATTHAS_RESTAURANT_MULTI_DISH_V1");\n  if (input.campaignType === "PRODUCT_PUSH") return getLayout("ATTHAS_RESTAURANT_FOOD_HERO_V1");\n  if (role === "brand-building") return getLayout("ATTHAS_RESTAURANT_EDITORIAL_V1");\n'
          )
          p.write_text(text)

          p = Path('src/commands/producePlannedCampaign.ts')
          text = p.read_text()
          text = text.replace(
              '    creative: directed.creative,\n    format: directed.production.format,\n',
              '    creative: directed.creative,\n    format: directed.production.format,\n    campaignType: request.entry.campaignType,\n',
              1,
          )
          p.write_text(text)

          p = Path('src/visualQa/gemini.ts')
          text = p.read_text()
          anchor = '    "Never infer ingredients, ownership, advertising rights or product identity beyond the supplied verified facts.",\n'
          addition = anchor + '''    "Use evidence-anchored scoring rather than a generic conservative default.",\n    "Product truth rubric: 90-100 when the visible product form matches the supplied product identity, verified visible ingredients are represented without unverified additions, and there is no visible contradiction; 80-89 only for a concrete ambiguity or partial occlusion; below 80 requires a specific visible mismatch, missing/extra ingredient, wrong product form or other stated evidence in issues/notes.",\n    "Governance rubric: 90-100 when no prohibited text, logo, price, branded packaging, badge, label, UI or other forbidden graphic element is visible; below 90 requires the specific visible governance defect to be stated in issues/notes.",\n    "Do not reduce product-truth or governance scores merely because the campaign is synthetic/internal calibration, because no reference photograph was supplied, or because a verified cooking method was intentionally absent.",\n    "Rights score is about the supplied deterministic rights status, not visual confidence: cleared should score 100, unknown cannot score as cleared, blocked must score 0 and BLOCK.",\n'''
          if addition not in text:
              text = text.replace(anchor, addition)
          p.write_text(text)

          p = Path('docs/ATTHAS_LAYOUT_SYSTEM.md')
          text = p.read_text()
          text = text.replace(
              '1. shared-table / spread / variety direction → Multi Dish\n2. recommended concept is brand-building → Editorial\n3. deterministic verified price overlay → Food Hero\n4. otherwise → Hospitality\n',
              '1. shared-table / spread / variety direction → Multi Dish\n2. `PRODUCT_PUSH` campaign → Food Hero\n3. recommended concept is brand-building → Editorial\n4. deterministic verified price overlay → Food Hero\n5. otherwise → Hospitality\n'
          )
          p.write_text(text)
          PY

          cat > tests/atthasLayoutCampaignType.test.ts <<'EOF'
          import assert from "node:assert/strict";
          import test from "node:test";

          import type { CampaignCreativeOutput, CampaignProductionFormat } from "../src/creativeTypes.js";
          import { selectAtthasLayout } from "../src/layouts/atthas.js";

          function creative(role: "conversion" | "brand-building" = "conversion"): CampaignCreativeOutput {
            return {
              concepts: [{
                id: "C1",
                strategicRole: role,
                campaignName: "Food focus",
                coreIdea: "Show the product clearly.",
                customerEmotion: "interest",
                headlineDirection: "Chicken Tikka Wrap",
                visualConcept: "Single food hero.",
                cta: "Visit Us",
                targetAudience: "Diners",
                expectedStrength: 8,
                risks: [],
              }],
              recommendedConceptId: "C1",
              recommendationReason: "Fits the campaign.",
              creativeBrief: {
                headline: "Chicken Tikka Wrap",
                supportingCopy: "A focused food moment.",
                cta: "Visit Us",
                visualDirection: "Single product-led food hero.",
                composition: "Food hero with negative space.",
                lighting: "Controlled food lighting.",
                photographyStyle: "Photoreal food photography.",
                aspectRatio: "4:5",
              },
              caption: "Chicken Tikka Wrap.",
              imageGeneration: {
                basePrompt: "Photoreal food image.",
                negativePrompt: "text, logos",
                visualConstraints: ["single food hero"],
                textPolicy: "NO_TEXT_OR_LOGOS",
              },
              overlaySpec: {
                headline: "Chicken Tikka Wrap",
                supportingCopy: "A focused food moment.",
                cta: "Visit Us",
                logoUsage: "OMIT",
                placementHints: {
                  headline: "upper-left",
                  supportingCopy: "below headline",
                  cta: "lower-right",
                  logo: "omit",
                },
              },
              factualQaNotes: [],
            };
          }

          const format: CampaignProductionFormat = {
            channel: "instagram",
            assetType: "poster",
            aspectRatio: "4:5",
            width: 1080,
            height: 1350,
          };

          test("restaurant PRODUCT_PUSH deterministically selects Food Hero", () => {
            const layout = selectAtthasLayout({
              brandId: "ATTHAS_RESTAURANT",
              campaignType: "PRODUCT_PUSH",
              creative: creative(),
              format,
            });
            assert.equal(layout.id, "ATTHAS_RESTAURANT_FOOD_HERO_V1");
          });

          test("restaurant DINE_IN remains Hospitality when no stronger layout signal exists", () => {
            const layout = selectAtthasLayout({
              brandId: "ATTHAS_RESTAURANT",
              campaignType: "DINE_IN",
              creative: creative(),
              format,
            });
            assert.equal(layout.id, "ATTHAS_RESTAURANT_HOSPITALITY_V1");
          });

          test("shared-table language still overrides PRODUCT_PUSH to Multi Dish", () => {
            const value = creative();
            value.creativeBrief.visualDirection = "A shared table spread with multiple dishes.";
            const layout = selectAtthasLayout({
              brandId: "ATTHAS_RESTAURANT",
              campaignType: "PRODUCT_PUSH",
              creative: value,
              format,
            });
            assert.equal(layout.id, "ATTHAS_RESTAURANT_MULTI_DISH_V1");
          });
          EOF
      - name: Install dependencies
        run: npm ci
      - name: Validate repository
        run: npm run check
      - name: Commit patch when needed
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/layouts/atthas.ts src/commands/producePlannedCampaign.ts src/visualQa/gemini.ts docs/ATTHAS_LAYOUT_SYSTEM.md tests/atthasLayoutCampaignType.test.ts
          git commit -m "Route restaurant product pushes to food hero"
          git push origin HEAD:fix-m2-product-push-calibration
