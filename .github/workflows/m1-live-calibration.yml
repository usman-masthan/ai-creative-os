name: M1 Live Calibration

on:
  push:
    branches: [m1-live-calibration]

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_CAMPAIGN_MODEL: gemini-3.5-flash-lite

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify calibration secret
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY repository secret is required for live M1 calibration."
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Run three live strategist calibrations
        run: npx tsx scripts/m1-live-calibration.ts

      - name: Upload AI Trace calibration bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-live-calibration
          path: output/m1-calibration
          if-no-files-found: warn
