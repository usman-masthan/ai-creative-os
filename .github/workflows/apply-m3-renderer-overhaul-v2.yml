name: Apply M3 renderer overhaul v2
on:
  push:
    branches: [m3-renderer-overhaul]
    paths: [.github/workflows/apply-m3-renderer-overhaul-v2.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m3-renderer-overhaul
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python .github/scripts/apply-m3-renderer.py
      - run: npm ci
      - run: npm run check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/creativeTypes.ts src/creativeValidator.ts src/posterTemplate.ts src/commands/producePoster.ts src/commands/producePlannedCampaign.ts tests/productionOrchestrator.test.ts
          git commit -m "Wire M3 renderer into poster production"
          git push origin HEAD:m3-renderer-overhaul
