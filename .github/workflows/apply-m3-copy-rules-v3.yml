name: Apply M3 copy rules v3
on:
  push:
    branches: [m3-campaign-copy-rules]
    paths: [.github/workflows/apply-m3-copy-rules-v3.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m3-campaign-copy-rules
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Normalize copy-rule context and legacy fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/campaignCopyRules.ts')
          t = p.read_text()
          old = 'campaignType?: MarketingCampaignType;'
          assert t.count(old) == 2
          p.write_text(t.replace(old, 'campaignType: MarketingCampaignType | undefined;'))

          p = Path('tests/structuredBriefProductionGate.test.ts')
          t = p.read_text()
          old = '''function invalidFinalCreative(): CampaignCreativeOutput {
  const value = structuredClone(baseCreative());
  value.creativeBrief.composition =
    "Keep the focal subject centre-right with a red rectangle and CTA box in the upper-left.";
  return value;
}
'''
          new = '''function invalidFinalCreative(): CampaignCreativeOutput {
  const value = structuredClone(baseCreative());
  value.creativeBrief.cta = "Discover ATTHA'S";
  value.overlaySpec.cta = "Discover ATTHA'S";
  value.creativeBrief.composition =
    "Keep the focal subject centre-right with a red rectangle and CTA box in the upper-left.";
  return value;
}
'''
          assert old in t
          p.write_text(t.replace(old, new, 1))
          PY
      - run: python .github/scripts/apply-m3-copy-rules.py
      - run: npm ci
      - run: npm run check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/campaignCopyRules.ts src/commands/generateCampaign.ts src/commands/producePlannedCampaign.ts src/creativeDirectorPrompt.ts src/creativeDirectorTypes.ts src/commands/directCampaign.ts tests/creativeDirector.test.ts tests/structuredBriefProductionGate.test.ts
          git commit -m "Wire M3 copy policies into finalization"
          git push origin HEAD:m3-campaign-copy-rules
