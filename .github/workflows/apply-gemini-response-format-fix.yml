name: Apply Gemini response format fix

on:
  push:
    branches:
      - fix-gemini-response-format-enum

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-gemini-response-format-enum
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply targeted response-format enum fix
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('src/visualQa/gemini.ts'): [('mimeType: "application/json",\n                schema: VISUAL_QA_SCHEMA,', 'mimeType: "APPLICATION_JSON",\n                schema: VISUAL_QA_SCHEMA,')],
              Path('src/finalArtQa/gemini.ts'): [('mimeType: "application/json", schema: FINAL_ART_SCHEMA', 'mimeType: "APPLICATION_JSON", schema: FINAL_ART_SCHEMA')],
              Path('tests/geminiVisualQa.test.ts'): [('assert.equal(body.generationConfig.responseFormat.text.mimeType, "application/json");', 'assert.equal(body.generationConfig.responseFormat.text.mimeType, "APPLICATION_JSON");')],
          }

          changed = False
          for path, pairs in replacements.items():
              text = path.read_text()
              original = text
              for old, new in pairs:
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text)
                  changed = True

          if not changed:
              print('No patch needed.')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Validate repository
        run: npm run check
      - name: Commit patch when needed
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/visualQa/gemini.ts src/finalArtQa/gemini.ts tests/geminiVisualQa.test.ts
          git commit -m "Fix Gemini structured response MIME enum"
          git push origin HEAD:fix-gemini-response-format-enum
