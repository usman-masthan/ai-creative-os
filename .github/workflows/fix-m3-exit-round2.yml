name: Fix M3 Exit Round 2

on:
  push:
    branches:
      - m3-exit-calibration
    paths:
      - .github/workflows/fix-m3-exit-round2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: m3-exit-calibration
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Apply fixes
        run: python .github/scripts/fix-m3-exit-round2.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and test
        run: npm run check
      - name: Commit validated fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/structuredImageBrief.ts src/layouts/atthas.ts src/visualQa/gemini.ts tests/atthasLayouts.test.ts tests/geminiVisualQa.test.ts tests/structuredBriefGovernance.test.ts
          git commit -m "Fix M3 exit generic concept governance"
          git push origin HEAD:m3-exit-calibration
