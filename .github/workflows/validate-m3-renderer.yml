name: Validate M3 renderer
on:
  push:
    branches: [m3-renderer-overhaul]
    paths: [.github/workflows/validate-m3-renderer.yml]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m3-renderer-overhaul
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
