name: M2 Food Composer Prototype

on:
  push:
    branches: [m2-food-composer-prototype]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_CAMPAIGN_MODEL: gemini-3.5-flash-lite

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify live Gemini secret
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY is required. This prototype must run against live Gemini."
            exit 1
          fi
          echo "Prototype mode: LIVE_GEMINI"

      - name: Typecheck
        run: npm run typecheck

      - name: Run ten physical food composer prototypes
        run: npx tsx scripts/m2-food-composer-prototype.ts

      - name: Upload prototype report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-food-composer-prototype
          path: output/m2-food-composer-prototype
          if-no-files-found: warn
